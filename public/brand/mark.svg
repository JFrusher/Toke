<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="toke">
  <!--
    The brace mark, redrawn as vector.

    It is the product's own syntax: a record between {{ }}, with a face. The
    raster original is a gradient; this uses currentColor so the mark takes the
    ink of whatever it sits in and stays legible at 16px in a browser tab.
  -->
  <title>toke</title>
  <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brace -->
    <path d="M22 10c-6 0-7 3-7 8v6c0 4-2 6-5 8 3 2 5 4 5 8v6c0 5 1 8 7 8" />
    <!-- Right brace -->
    <path d="M42 10c6 0 7 3 7 8v6c0 4 2 6 5 8-3 2-5 4-5 8v6c0 5-1 8-7 8" />
    <!-- Brows -->
    <path d="M24 25.5c1.6-1.8 4.4-1.8 6 0" />
    <path d="M34 25.5c1.6-1.8 4.4-1.8 6 0" />
    <!-- Smile -->
    <path d="M25 39c3.8 4 10.2 4 14 0" />
  </g>
  <!-- Eyes -->
  <g fill="currentColor">
    <circle cx="27" cy="32" r="3.1" />
    <circle cx="37" cy="32" r="3.1" />
  </g>
</svg>
