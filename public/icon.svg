<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="toke">
  <!--
    Favicon cut of the brace mark.

    The brows and smile are dropped and the braces thickened: at 16px in a
    browser tab those details collapse into noise, and a mark that is mush at
    its most common size is not doing its job. Eyes stay — they are what make
    it read as a face rather than a bracket pair.
  -->
  <title>toke</title>
  <rect width="64" height="64" rx="12" fill="#1F3A5F" />
  <g fill="none" stroke="#FAF8F4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 14c-5 0-6 2.5-6 7v5c0 3.5-1.5 5-4 6.5 2.5 1.5 4 3 4 6.5v5c0 4.5 1 7 6 7" />
    <path d="M40 14c5 0 6 2.5 6 7v5c0 3.5 1.5 5 4 6.5-2.5 1.5-4 3-4 6.5v5c0 4.5-1 7-6 7" />
  </g>
  <g fill="#FAF8F4">
    <circle cx="27.5" cy="32" r="3.4" />
    <circle cx="36.5" cy="32" r="3.4" />
  </g>
</svg>
